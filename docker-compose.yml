services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed - the database is reachable only within the Docker network.
    # Exposing 5432 to the host in production is a security risk.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only persistence: durable job state is the whole reason ADR-0023 chose a queue over an
    # in-process scheduler, and a restart that dropped it would silently skip a recurring run.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # No ports exposed - reachable only within the Docker network, like the database.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/itslhuis/remit:${REMIT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* variables are legitimate build args - Next.js embeds
        # them into the client bundle at build time.
        # DATABASE_URL and BETTER_AUTH_SECRET are runtime secrets and must
        # never appear under `args`. They are passed via `environment` below.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_STORAGE_BASE_URL: ${NEXT_PUBLIC_STORAGE_BASE_URL}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Runtime secrets - injected by Docker at container start, never baked
      # into the image. DATABASE_URL uses the Docker-internal `database` hostname
      # so the app can reach PostgreSQL within the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      REMIT_ENCRYPTION_KEY: ${REMIT_ENCRYPTION_KEY}
      REMIT_HOSTED_MODE: ${REMIT_HOSTED_MODE:-false}
      REMIT_DATA_DIR: /app/data
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_STORAGE_BASE_URL: ${NEXT_PUBLIC_STORAGE_BASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-remit}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    volumes:
      - ${REMIT_DATA_DIR:-./data}:/app/data
      - uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Requires a /api/health endpoint in the application (recommended).
      # Adjust the path if your health endpoint differs.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ghcr.io/itslhuis/remit:${REMIT_IMAGE_TAG:-latest}
    restart: unless-stopped
    # The same image as `app`, running a second process. `entrypoint` is overridden rather than
    # `command` because docker-entrypoint.sh runs migrations and then execs the web server, ignoring
    # any arguments appended to it - a `command:` here would start a second web server instead.
    # Waiting on `app` being healthy is what keeps the two containers from migrating concurrently.
    entrypoint: ["node", "scripts/dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      REMIT_ENCRYPTION_KEY: ${REMIT_ENCRYPTION_KEY}
      REMIT_HOSTED_MODE: ${REMIT_HOSTED_MODE:-false}
      REMIT_DATA_DIR: /app/data
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_STORAGE_BASE_URL: ${NEXT_PUBLIC_STORAGE_BASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-remit}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    volumes:
      - ${REMIT_DATA_DIR:-./data}:/app/data
      - uploads:/app/uploads
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads:
