services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed - the database is reachable only within the Docker network.
    # Exposing 5432 to the host in production is a security risk.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only persistence: durable job state is the whole reason ADR-0023 chose a queue over an
    # in-process scheduler, and a restart that dropped it would silently skip a recurring run.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # No ports exposed - reachable only within the Docker network, like the database.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    # RustFS, pinned to an exact release and its multi-arch index digest, never a moving tag: the
    # previous store's images vanished from two registries in two weeks, and a digest is the only
    # reference that always means the same bytes. Moving it is a deliberate change that repeats the
    # evaluation in ADR-0045, and the image workflow keeps a copy in this project's own registry.
    image: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    # The image's own non-root user (uid 10001). `storage_data` is a new volume, which Docker creates
    # owned by that user from the image's /data, so the store never needs root. An instance
    # upgraded from the previous store keeps its old volume untouched beside this one
    # (docs/operations/UPGRADE.md).
    restart: unless-stopped
    environment:
      # The same pair the app and worker authenticate with, so .env holds one source of truth.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      # No web console: nothing needs one, and it would be a root-credential login page.
      RUSTFS_CONSOLE_ENABLE: "false"
      # No call to the vendor's update service at every start (ADR-0018).
      RUSTFS_CHECK_UPDATE: "false"
      # Logs on stdout, where `docker compose logs storage` finds them, instead of a file that grows
      # inside the container.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - storage_data:/data
    # No ports exposed. Browsers never reach object storage: the app streams every upload in and
    # every public file out (ADR-0040).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/itslhuis/remit/app:${REMIT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit, because `worker` is the last stage in the Dockerfile and Compose would otherwise
      # build it here — handing the web image the Chromium closure that stage exists to keep out.
      target: runner
    restart: unless-stopped
    ports:
      # Loopback when a proxy on this host fronts the app — the installer writes 127.0.0.1 for the
      # `with-proxy` profile, so the only way in from outside is Caddy's TLS — and every interface
      # otherwise, for a reverse proxy on another machine or a trusted LAN.
      - "${REMIT_APP_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      # Runtime configuration - injected by Docker at container start, never baked into the image.
      # DATABASE_URL uses the Docker-internal `database` hostname so the app can reach PostgreSQL
      # within the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      REMIT_PUBLIC_URL: ${REMIT_PUBLIC_URL}
      REMIT_ENCRYPTION_KEY: ${REMIT_ENCRYPTION_KEY}
      REMIT_HOSTED_MODE: ${REMIT_HOSTED_MODE:-false}
      REMIT_DATA_DIR: /app/data
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-remit}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Empty leaves GET /api/metrics unavailable (404). When set, point a Prometheus scrape job at
      # /api/metrics with this value as its bearer token; docs/operations/METRICS.md has the config.
      REMIT_METRICS_TOKEN: ${REMIT_METRICS_TOKEN:-}
      # Empty sends nothing anywhere. Set, unhandled request errors are reported to this Sentry or
      # GlitchTip project; the worker below takes the same value for failed jobs.
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ${REMIT_DATA_DIR:-./data}:/app/data
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, never `localhost`: the Next standalone server binds the IPv4 wildcard only
      # (HOSTNAME=0.0.0.0), while `localhost` resolves to ::1 first inside the container, so a
      # `localhost` probe fails with "connection refused" against a perfectly healthy server.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ghcr.io/itslhuis/remit/worker:${REMIT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # A separate image from `app`, not the same one running a second process. The `worker` stage
      # adds Chromium for PDF rendering (ADR-0022) on top of the identical application layers, so the
      # web image stays free of it. Its own ENTRYPOINT starts the consumer, which is also why
      # docker-entrypoint.sh is not reached here - that script migrates and then execs the web
      # server. Waiting on `app` being healthy is what keeps the two containers from migrating
      # concurrently.
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      REMIT_PUBLIC_URL: ${REMIT_PUBLIC_URL}
      REMIT_ENCRYPTION_KEY: ${REMIT_ENCRYPTION_KEY}
      REMIT_HOSTED_MODE: ${REMIT_HOSTED_MODE:-false}
      REMIT_DATA_DIR: /app/data
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-remit}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ${REMIT_DATA_DIR:-./data}:/app/data
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Only with `--profile with-proxy`, or `COMPOSE_PROFILES=with-proxy` in `.env`, which is how the
  # installer enables it so a plain `docker compose up -d` and `scripts/host/upgrade.sh` keep it.
  caddy:
    image: caddy:2-alpine
    profiles: ["with-proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      REMIT_PUBLIC_URL: ${REMIT_PUBLIC_URL}
      REMIT_ACME_EMAIL: ${REMIT_ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The ACME account and every certificate. Losing it re-issues them, which Let's Encrypt rate
      # limits per domain, so it is a named volume rather than container state.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
