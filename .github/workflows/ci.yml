name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24.11.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      # The host-side scripts run on an operator's server with no TypeScript and no test runner in
      # front of them, so their static check is this step. ShellCheck is preinstalled on the runner.
      - name: Check shell scripts
        run: shellcheck scripts/host/*.sh docker-entrypoint.sh

  # Only a pull request has a base to compare against, and only a pull request can carry the
  # `no-changelog` label that says a change reaches no instance.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The base commit has to be in the clone for the diff and for reading CHANGELOG.md as it
          # was before this branch.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the changelog records this change
        if: "!contains(github.event.pull_request.labels.*.name, 'no-changelog')"
        run: pnpm changelog:check ${{ github.event.pull_request.base.sha }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The coverage run, not a plain `pnpm test`: it is the same suite, and its exit code is also the
      # services threshold in vitest.config.ts, which nothing enforced while this step ran without
      # it. One run rather than a second coverage job, so a flaky test cannot pass one and fail the
      # other, and the suite is not paid for twice.
      - name: Run unit tests with the coverage gate
        run: pnpm test:coverage

  integration-tests:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for test services
        run: |
          until docker compose -f docker-compose.test.yml exec -T database_test pg_isready -U remit_test -d remit_test; do
            sleep 1
          done
          until docker compose -f docker-compose.test.yml exec -T redis_test redis-cli ping; do
            sleep 1
          done

      - name: Run test migrations
        run: pnpm database:test:migrate

      - name: Run integration tests
        run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      BETTER_AUTH_SECRET: ci-secret-not-used-outside-build
      REMIT_PUBLIC_URL: http://localhost:3000
      REMIT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: remit
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
