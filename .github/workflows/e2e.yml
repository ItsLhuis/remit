name: E2E

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.11.1
  POSTGRES_USER: remit_e2e
  POSTGRES_PASSWORD: remit_e2e
  POSTGRES_DB: remit_e2e
  BETTER_AUTH_SECRET: e2e-secret-not-used-outside-ci
  REMIT_PUBLIC_URL: http://localhost:3000
  REMIT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  REMIT_HOSTED_MODE: "false"
  REMIT_DATA_DIR: ./data/e2e
  # Compose interpolates this into the app and the worker, which reach Redis over the compose
  # network. The Playwright step overrides it with the published port for its own process.
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  MINIO_BUCKET: remit
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  PLAYWRIGHT_SKIP_WEB_SERVER: "true"
  # The SMTP host as the app container resolves it: the mail sink's service name in
  # docker-compose.ci.yml, not the runner's localhost.
  PLAYWRIGHT_SMTP_HOST: mailpit
  # Every `docker compose` step sees the CI override. Without it, `logs` would leave out the mail
  # sink and `down` would leave it running, still holding the project network.
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
  # Host-side connection used by the Playwright process itself (owner provisioning and session
  # issuing run in Node, not in the browser). The app container gets its own DATABASE_URL from
  # docker-compose.yml against the internal `database` hostname; this one never reaches it.
  DATABASE_URL: postgresql://remit_e2e:remit_e2e@localhost:5432/remit_e2e

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Docker image
        run: docker compose build app

      - name: Start stack
        run: docker compose up -d

      - name: Wait for stack health
        run: |
          timeout 180 bash -c 'until curl -fsS http://localhost:3000/api/health; do docker compose ps; sleep 5; done'

      - name: Run E2E tests
        env:
          # Host-side, like DATABASE_URL above: flow 4 enqueues and waits on jobs from the Playwright
          # process itself, which cannot resolve the compose-internal `redis` host. It skipped itself
          # here until docker-compose.ci.yml published the port.
          REDIS_URL: redis://localhost:6379
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            tests/e2e/results
          if-no-files-found: ignore

      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
