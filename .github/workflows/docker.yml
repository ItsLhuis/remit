name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: remit

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # A tag pushed by hand skips `pnpm version:*`, which is what stamps the changelog. The tag build
      # refuses before anything is built or pushed, so no image ships for a version whose changelog
      # has no dated section saying what it changes.
      - name: Verify release changelog
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")

          if [[ "${package_version}" != "${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}"
            exit 1
          fi

          # A literal prefix match rather than a regex, so the dots in the version cannot match any
          # character and let `1.0.0` pass on a `## [1a0a0]` heading.
          heading="## [${version}] - "
          if ! awk -v heading="${heading}" 'index($0, heading) == 1 && substr($0, length(heading) + 1) ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for ${version}"
            exit 1
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two images under one name, `remit/app` and `remit/worker`, matching the `image:` lines in
      # docker-compose.yml. Both are tagged in the same step so a push can never publish one tag for
      # the app and a different one for the worker.
      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          prefix="${REGISTRY}/${owner}/${IMAGE_NAME}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            suffixes=("${GITHUB_REF_NAME}")
          else
            suffixes=("latest" "${GITHUB_SHA}")
          fi

          for image in app worker; do
            {
              echo "${image}<<EOF"
              for suffix in "${suffixes[@]}"; do
                echo "${prefix}/${image}:${suffix}"
              done
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      # Each target builds exactly the stage docker-compose.yml runs for it. Building with no target
      # produced the Dockerfile's last stage, the worker, and published it under the application's
      # name. Neither image takes a build argument: nothing about a deployment is baked in, so the
      # same image serves every address (ADR-0040).
      - name: Build and push the application image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.app }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push the worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.worker }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
