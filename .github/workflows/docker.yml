name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: remit

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # A tag pushed by hand skips `pnpm version:*`, which is what stamps the changelog. The tag build
      # refuses before anything is built or pushed, so no image ships for a version whose changelog
      # has no dated section saying what it changes.
      - name: Verify release changelog
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")

          if [[ "${package_version}" != "${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}"
            exit 1
          fi

          # A literal prefix match rather than a regex, so the dots in the version cannot match any
          # character and let `1.0.0` pass on a `## [1a0a0]` heading.
          heading="## [${version}] - "
          if ! awk -v heading="${heading}" 'index($0, heading) == 1 && substr($0, length(heading) + 1) ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for ${version}"
            exit 1
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${REGISTRY}/${owner}/${IMAGE_NAME}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${image}:${GITHUB_REF_NAME}"
          else
            tags="${image}:latest"$'\n'"${image}:${GITHUB_SHA}"
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # NEXT_PUBLIC_* are baked at build time by Next.js. The published image
          # intentionally omits them so operators set their own values via
          # docker-compose build (which reads from their .env file).
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
