services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Port exposed to the host in development only - useful for local database clients
      # (for example TablePlus, psql). Never expose this in production.
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remit}
      POSTGRES_DB: ${POSTGRES_DB:-remit}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remit} -d ${POSTGRES_DB:-remit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only persistence: durable job state is the whole reason ADR-0023 chose a queue over an
    # in-process scheduler, and a restart that dropped it would silently skip a recurring run.
    command: redis-server --appendonly yes
    ports:
      # Exposed to the host in development only - the app and the worker both run on the host there.
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    # The store docker-compose.yml bundles, pinned to the same digest (ADR-0045).
    image: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-remit}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-remitremit}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - storage_dev_data:/data
    ports:
      # The S3 API, exposed to the host in development only - the app and the worker both run on the
      # host there. There is no console to publish.
      - "${STORAGE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development-only mail sink. It accepts every message and delivers none of them, which is what
  # makes the email-configured half of a flow testable without a real provider or a real inbox:
  # SMTP on 1025, web UI on 8025. Deliberately has no volume — a restart should start from an empty
  # mailbox, and nothing here is worth keeping.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
  storage_dev_data:
