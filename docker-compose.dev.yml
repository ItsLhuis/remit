services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Port exposed to the host in development only - useful for local database clients
      # (for example TablePlus, psql). Never expose this in production.
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remit}
      POSTGRES_DB: ${POSTGRES_DB:-remit}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remit} -d ${POSTGRES_DB:-remit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only persistence: durable job state is the whole reason ADR-0023 chose a queue over an
    # in-process scheduler, and a restart that dropped it would silently skip a recurring run.
    command: redis-server --appendonly yes
    ports:
      # Exposed to the host in development only - the app and the worker both run on the host there.
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Chainguard's build of its maintained MinIO fork. MinIO no longer publishes a public image:
    # minio/minio on Docker Hub and quay.io/minio/minio both refuse anonymous pulls.
    image: cgr.dev/chainguard/minio:latest
    # Root, not the image's default uid 65532: the official image ran as root, so every existing
    # minio_dev_data volume is root-owned, and as a non-root user MinIO refuses to start on one
    # ("Unable to write to the backend").
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-remit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-remitremit}
    volumes:
      - minio_dev_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      # Console port exposed in dev for the MinIO web UI.
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Development-only mail sink. It accepts every message and delivers none of them, which is what
  # makes the email-configured half of a flow testable without a real provider or a real inbox:
  # SMTP on 1025, web UI on 8025. Deliberately has no volume — a restart should start from an empty
  # mailbox, and nothing here is worth keeping.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
