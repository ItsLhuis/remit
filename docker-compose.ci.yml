# CI-only override for the E2E workflow. Playwright runs on the runner host, outside the compose
# network, and provisions the owner account through the app's own Better Auth context, so it needs a
# direct PostgreSQL connection. docker-compose.yml deliberately keeps 5432 unexposed because
# exposing it in production is a security risk - this override exists solely for an ephemeral CI
# runner and must never be composed into a deployment.
services:
  database:
    ports:
      - "5432:5432"

  # The mail sink `tests/e2e/proposalToPaid.spec.ts` reads the acceptance code from. The app container
  # delivers to it over the compose network as `mailpit:1025`, the SMTP host e2e.yml hands
  # `tests/e2e/support/emailDelivery.ts`, so only the API port is published, for
  # `tests/e2e/support/mailbox.ts` on the runner host.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"

  # `tests/e2e/recurringGeneration.spec.ts` drives a real queue from the Playwright process, which
  # runs on the runner rather than in this network, so it needs Redis the same way it needs
  # PostgreSQL above. Without this the spec skips itself and the recurring-generation flow is never
  # exercised in CI. The app and the worker keep reaching Redis over the compose network.
  redis:
    ports:
      - "6379:6379"
