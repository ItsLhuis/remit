# Its own Compose project, never the directory-named one the development stack uses: `docker compose
# down -v` on either stack would otherwise reach into the other's containers and network, and the
# published ports below would collide with the development services rather than sit beside them.
name: remit-test

services:
  database_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remit_test
      POSTGRES_PASSWORD: remit_test
      POSTGRES_DB: remit_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remit_test -d remit_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    ports:
      # 6380, never the development stack's 6379: on a developer host that port is already taken, so
      # this container could not start beside it and the integration suite counted, queued and
      # obliterated against the queue the developer's own app was using.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The integration suite's own object store — the image docker-compose.yml bundles, pinned to the same
  # digest — on 9020, never the development stack's 9000, so a storage test can never write into the
  # store the developer's own app reads.
  storage_test:
    image: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: remit-test
      RUSTFS_SECRET_KEY: remit-test-secret
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "9020:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
