# Project-local Codex configuration for this repository.
# Codex reads AGENTS.md at the root; it has no import syntax, so AGENTS.md links the rules in
# .agents/rules/ and Codex opens the ones a change touches. Skills are read from .agents/skills/.

# Codex's default instruction budget is 32 KiB across all files; tests/docs/agentFiles.test.ts keeps
# AGENTS.md under that, and this higher ceiling leaves room without silent truncation.
project_doc_max_bytes = 65536
